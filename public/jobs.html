<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse jobs · Plumtree Connect</title>
<meta name="description" content="Browse open jobs in Plumtree, Bulilima, Mangwe and Matabeleland South. Filter by category, area, job type and salary.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div data-header></div>

<div style="background:linear-gradient(140deg,var(--green-900),var(--green-800));color:#fff">
  <div class="container" style="padding:1.8rem 1.15rem">
    <p class="eyebrow" style="color:#f0b878">Job board</p>
    <h1 style="color:#fff;margin-bottom:.3rem">Find your next job</h1>
    <p class="mb0" style="color:rgba(255,255,255,.85)">Vacancies from employers across Plumtree and Matabeleland South.</p>
  </div>
</div>

<main class="container" style="padding:1.6rem 1.15rem 2.6rem">
  <div class="grid-side-left">
    <aside class="card sticky-side">
      <div class="spread" style="margin-bottom:.7rem">
        <b>Filters</b>
        <button class="btn btn-xs btn-ghost" id="clear-filters">Clear all</button>
      </div>
      <form id="filter-form">
        <label class="field">
          <span class="lbl">Keyword</span>
          <input type="search" name="q" id="f-q" placeholder="Title, company…">
        </label>
        <div class="filter-group">
          <span class="lbl">Category</span>
          <div class="filter-list" id="f-categories"><div class="skeleton" style="height:26px;margin-bottom:.3rem"></div><div class="skeleton" style="height:26px"></div></div>
        </div>
        <div class="filter-group">
          <span class="lbl">Area</span>
          <div class="filter-list" id="f-locations"></div>
        </div>
        <div class="filter-group">
          <span class="lbl">Job type</span>
          <div class="chips" id="f-job-types"></div>
        </div>
        <div class="filter-group">
          <span class="lbl">Work mode</span>
          <div class="chips" id="f-work-modes"></div>
        </div>
        <label class="field">
          <span class="lbl">Minimum salary (USD)</span>
          <input type="number" name="min_salary" id="f-min-salary" min="0" step="10" placeholder="Any">
        </label>
        <button class="btn btn-block" type="submit">Apply filters</button>
      </form>
    </aside>

    <section>
      <div class="panel" style="margin-bottom:1rem">
        <div class="panel-body row row-wrap" style="gap:.7rem">
          <div class="grow">
            <input type="search" id="quick-search" placeholder="Search jobs by title or company…">
          </div>
          <label class="row small" style="gap:.35rem;white-space:nowrap">
            <span class="muted">Sort</span>
            <select id="sort" style="width:auto">
              <option value="recent">Newest first</option>
              <option value="deadline">Closing soon</option>
              <option value="salary">Highest salary</option>
              <option value="popular">Most viewed</option>
            </select>
          </label>
        </div>
      </div>
      <div class="spread" style="margin-bottom:.9rem">
        <p class="mb0 small muted" id="result-count">Loading…</p>
        <div class="chips" id="active-chips"></div>
      </div>
      <div id="job-list" class="stack"><div class="spinner"></div></div>
      <div class="pager" id="pager"></div>
    </section>
  </div>
</main>

<div data-footer></div>
<script src="/js/core.js"></script>
<script src="/js/jobs.js"></script>
</body>
</html>
